services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: logistics, POSTGRES_PASSWORD: logistics, POSTGRES_DB: logistics}
    ports: ["5432:5432"]
  redis:
    image: redis:7
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://logistics:logistics@db:5432/logistics
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [db, redis]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://logistics:logistics@db:5432/logistics
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    command: celery -A app.tasks.celery_app worker -l info
  beat:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://logistics:logistics@db:5432/logistics
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
    command: celery -A app.tasks.celery_app beat -l info
